<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habit tracker · simply-html substrate</title>
  <!--
    ============================================================================================
    HOW TO READ THIS FILE — the two halves matter, and they are authored by different parties.

    This is a STANDALONE page shell wrapping a simply-html app, so you can open it and see the
    runtime work. A simply-html page has three layers, by three authors:

      • STRUCTURE  (the HTML)            — authored by the model/you
      • BEHAVIOR   (the runtime)         — authored by simply-html (audited, ships with it)
      • DESIGN     (the CSS)             — authored by the host / design system

    The headline rule — "the model writes content, never JavaScript or CSS" — is about the
    MODEL-AUTHORED layer only: the `<div data-sh-app>…</div>` region far below. THAT region has
    zero JavaScript and zero CSS — only HTML + read-only formulas + closed data-sh-* directives.

    The `<style>` block and the `<script>` tag in THIS file are the HOST's shell, NOT model
    output: the <style> is the host's design, and the <script> is the one audited runtime that
    owns all behavior (it reads the directives, binds formulas, and runs the closed actions).
    On a hosted simply-html page those two are supplied by the host and the sanitizer; the model
    never writes them. So a `<style>`/`<script>` here is the system working as intended, not a
    violation of the rule.
    ============================================================================================
  -->
  <!-- ↓↓↓ HOST SHELL (design) — NOT model-authored ↓↓↓ -->
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; max-width: 30rem; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    .sub { color: #6b7280; margin: 0 0 1.5rem; }
    /* reveal the app only after the runtime hydrates it — no pre-render template flash */
    [data-sh-app]:not([data-sh-ready]) { visibility: hidden; }
    .progress { font-weight: 600; margin: 0 0 1rem; }
    .celebrate { margin: 0 0 1rem; padding: .6rem .8rem; border-radius: .5rem; background: #ecfdf5; color: #065f46; }
    ul.habits { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .4rem; }
    ul.habits li { display: flex; align-items: center; gap: .5rem; }
    .habit { flex: 1; text-align: left; padding: .55rem .7rem; border: 1px solid #d1d5db; border-radius: .5rem;
             background: transparent; font: inherit; cursor: pointer; }
    .habit.done { color: #6b7280; text-decoration: line-through; border-color: #a7f3d0; background: #f0fdf4; }
    .remove { border: none; background: transparent; color: #9ca3af; cursor: pointer; font-size: 1.1rem; line-height: 1; }
    .remove:hover { color: #ef4444; }
    .add-row { display: flex; gap: .5rem; margin-top: 1rem; }
    .add-row input { flex: 1; padding: .55rem .7rem; border: 1px solid #d1d5db; border-radius: .5rem; font: inherit; }
    .add-row button { padding: .55rem .9rem; border: 1px solid #d1d5db; border-radius: .5rem; background: #111827; color: #fff;
                      font: inherit; cursor: pointer; }
    .add-row button:hover { background: #374151; }
  </style>
</head>
<body>
  <h1>Today's habits</h1>
  <p class="sub">A reactive mini-app — no page-authored JavaScript, just formulas + directives.</p>

  <!-- ╔══════════════════════════════════════════════════════════════════════════════════════╗ -->
  <!-- ║ ↓↓↓ MODEL-AUTHORED REGION — HTML + read-only formulas + data-sh-* ONLY.               ║ -->
  <!-- ║     No <script>, no JavaScript, no <style>, no style=, no invented classes.           ║ -->
  <!-- ╚══════════════════════════════════════════════════════════════════════════════════════╝ -->
  <div data-sh-app
       data-sh-state='{"draft":"","habits":[
         {"name":"Drink water","done":true},
         {"name":"Stretch 5 min","done":false},
         {"name":"Read 10 pages","done":false},
         {"name":"Inbox to zero","done":false}
       ]}'>

    <p class="progress" data-sh-text="count(habits where done) + ' of ' + count(habits) + ' done'"></p>

    <p class="celebrate"
       data-sh-show="count(habits) > 0 and count(habits where done) == count(habits)">
      🔥 All done. Nice work.
    </p>

    <!-- define the row once as a reusable component, then stamp it per item -->
    <div data-sh-def="habit-row">
      <button class="habit"
              data-sh-class="done h.done"
              data-sh-on="click: toggle(h, 'done')"
              data-sh-text="if(h.done, '✓  ', '○  ') + h.name"></button>
      <button class="remove" title="remove" data-sh-on="click: remove(habits, h)">×</button>
    </div>

    <ul class="habits" data-sh-repeat="habits" data-sh-as="h">
      <li data-sh-use="habit-row" data-sh-arg-h="h"></li>
    </ul>

    <div class="add-row">
      <input data-sh-bind="draft" placeholder="Add a habit…" maxlength="60"
             data-sh-on="keydown.enter: add(habits, {name: draft, done: false}); set($, 'draft', '')">
      <button data-sh-on="click: add(habits, {name: draft, done: false}); set($, 'draft', '')">Add</button>
    </div>
  </div>
  <!-- ↑↑↑ END MODEL-AUTHORED REGION ↑↑↑ -->

  <!-- HOST SHELL (behavior): the ONE audited runtime — not model-authored. It reads the
       data-sh-* directives above and owns all interactivity. The model never writes this. -->
  <script src="../dist/runtime/runtime.js"></script>
</body>
</html>
